name: CD · build & deploy to Azure

# Manual, credentials-gated deployment. Requires these repo secrets:
#   AZURE_CREDENTIALS      - service principal JSON (azure/login)
#   ACR_LOGIN_SERVER       - e.g. myacr.azurecr.io
#   AZURE_RESOURCE_GROUP   - target resource group
#   PG_ADMIN_PASSWORD      - PostgreSQL admin password
on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'Image tag to build and deploy'
        required: false
        default: ''

jobs:
  deploy:
    name: Build images, push to ACR, deploy Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ github.event.inputs.imageTag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & push images to ACR
        env:
          ACR: ${{ secrets.ACR_LOGIN_SERVER }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          REGISTRY_NAME="${ACR%%.*}"
          az acr build -r "$REGISTRY_NAME" -t "motorvalley-backend:$TAG"  ./backend
          az acr build -r "$REGISTRY_NAME" -t "motorvalley-processor:$TAG" ./processor
          az acr build -r "$REGISTRY_NAME" -t "motorvalley-producer:$TAG"  ./producer
          az acr build -r "$REGISTRY_NAME" -t "motorvalley-frontend:$TAG"  ./frontend

      - name: Deploy infrastructure
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: deploy/azure/main.bicep
          parameters: >-
            acrLoginServer=${{ secrets.ACR_LOGIN_SERVER }}
            imageTag=${{ steps.tag.outputs.value }}
            postgresAdminPassword=${{ secrets.PG_ADMIN_PASSWORD }}
